# Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
_target_: verl.workers.config.DistillationConfig

# specify the default per-component configs
defaults:

  # <folder_name>@<field_name>.<field_name>: <yaml_file_name>

  # load the default config, then apply the fields in the current yaml
  # self config override anything above
  - _self_

# Whether to enable distillation.
enabled: false

# distillation loss config
distillation_loss:

  # # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.workers.config.DistillationLossConfig


  # Loss function mode for distillation
  loss_mode: k3

  # If distillation loss requires top-k logits, this is the value of k
  topk: 32

  # Whether to include task rewards alongside distillation loss.
  use_task_rewards: true


  # The coef of the distillation loss when use_task_rewards is true
  distillation_loss_coef: 1.0

  # Optional max clamp value for distillation loss. If null, no clamping is applied.
  loss_max_clamp: null

  # Optional min clamp value for log probabilities for stability, e.g., log q - log p where p or q are very close to zero.
  log_prob_min_clamp: null

  # Whether to incorporate distillation loss as a reward.
  use_policy_gradient: false

  # Name of the policy loss to use when use_policy_gradient is true.
  policy_loss_mode: "vanilla"

  # PPO clipping ratio for policy loss.
  clip_ratio: 0.2

  # Lower bound for PPO clipping ratio.
  clip_ratio_low: 0.2 

  # Upper bound for PPO clipping ratio.
  clip_ratio_high: 0.2


# OmniOPD generative-critic objective (loss_mode=omniopd). Present in the schema rather than added
# with a CLI '+' because the agent loop reads it off the RAW DictConfig
# (agent_loop.py _compute_omniopd_audit), where a missing key is a struct-mode error rather than a
# fallback to the dataclass default. The values below ARE the dataclass defaults; _target_ is
# required, or omega_conf_to_dataclass hands DistillationConfig a plain dict and __post_init__ dies
# reading self.omniopd.C.
omniopd:
  _target_: verl.workers.config.distillation.OmniOPDConfig

  # Audited chunks per trajectory, at the highest full-vocabulary entropy positions.
  M: 10

  # Teacher continuations sampled per chunk.
  N: 10

  # Tokens per chunk, and per teacher continuation.
  C: 50

  # Dirichlet-Multinomial smoothing of the Bayesian target.
  alpha: 1.0

  # Weight of the trust-region anchor on unaudited positions.
  beta: 0.1

  # Semantic metric: "ned" or "rouge1". Only "ned" is implemented.
  phi: ned

  # 0 means exact full-vocabulary entropy for chunk selection (FID-1). Non-zero is a recorded
  # deviation: a truncated tail under-estimates H and selects DIFFERENT chunks.
  entropy_topk: 0

# State-Credit OPD (loss_mode=state_credit). Present in the schema for the same reason the omniopd
# node is: the agent loop reads it off the RAW DictConfig, where a missing key is a struct-mode
# error raised mid-rollout rather than a fallback. _target_ is required or omega_conf_to_dataclass
# hands DistillationConfig a plain dict.
state_credit:
  _target_: verl.workers.config.distillation.StateCreditConfig

  # INTERIOR cut points, ascending. Empty disables it.
  depths: []

  # Continuations per Phi estimate. The dominant recurring cost -- it multiplies by depths, by
  # rollouts per problem, and by every optimizer step.
  M: 4

  # The total response HORIZON a continuation is scored against, in tokens. Set it to the
  # student's own data.max_response_length: under budget_mode=remaining the teacher shares that
  # budget rather than getting a fresh one.
  B: 20480

  # How B becomes a per-depth budget.
  #   remaining: depth d writes B - d tokens, so prefix + continuation obeys the same horizon the
  #     student trains under. Phi is then one functional at every depth -- "still solvable inside
  #     the task's budget?" -- and the teacher's context is flat at prompt + B.
  #   fixed: every depth gets a full B on top of its prefix. A different, budget-free Phi, and a
  #     deep state is scored with more room than the task ever allows.
  budget_mode: remaining

  # How a chunk's centered credit reaches its tokens.
  #   broadcast: every token in the chunk gets the same G~ (Sec 7); the loss aggregator owns 1/T.
  #   per_chunk: divide by (chunks in row * chunk length), giving each chunk equal TOTAL weight
  #     (Sec 7.1). That also over-weights a short terminal chunk's tokens, so it is an ablation.
  credit_norm: broadcast

  # Token-level OPD estimator supplying a_t^OPD in u_t = a_t^OPD + beta * G~. "none" drops the
  # base signal entirely, which is the credit-only diagnostic arm and not the method.
  base_loss_mode: k1

  # Weight of the state term against the token-level OPD advantage.
  beta: 1.0

  # Which teacher_models entry is the frozen continuation model.
  pi_c_key: math

  # Per-(group, depth) floor for leave-one-out. Below this the chunk is dropped, never centered
  # against zero.
  min_survivors: 3

# Number of GPUs per node in the distillation teacher resource pool
n_gpus_per_node: 8

# Number of nodes in the distillation teacher resource pool
nnodes: 0

# multi-teacher configs
teacher_models:

  # Single-teacher config. This entry is popped when other teacher entries are added, so
  # using `teacher_model` as one of several keys silently drops it. For
  # example, the following CLI overrides result in ONLY `teacher_model2` being used:
  #
  # distillation.teacher_models.teacher_model.key=openai/gsm8k
  # distillation.teacher_models.teacher_model.model_path=Qwen/Qwen3-4B
  # +distillation.teacher_models.teacher_model2.key=hiyouga/geometry3k
  # +distillation.teacher_models.teacher_model2.model_path=Qwen/Qwen3-VL-4B-Instruct
  #
  # Instead, give the first teacher a different name:
  #
  # +distillation.teacher_models.teacher_model1.key=openai/gsm8k
  # +distillation.teacher_models.teacher_model1.model_path=Qwen/Qwen3-4B
  # +distillation.teacher_models.teacher_model2.key=hiyouga/geometry3k
  # +distillation.teacher_models.teacher_model2.model_path=Qwen/Qwen3-VL-4B-Instruct
  teacher_model:
    _target_: verl.workers.config.DistillationTeacherModelConfig
    key: null
    model_path: null
    num_replicas: 0
    inference:
      _target_: verl.workers.config.RolloutConfig
      name: ${oc.select:actor_rollout_ref.rollout.name}
      dtype: ${oc.select:actor_rollout_ref.rollout.dtype}
      gpu_memory_utilization: 0.5
      enforce_eager: true
      cudagraph_capture_sizes: null
      free_cache_engine: true
      data_parallel_size: 1
      expert_parallel_size: 1
      tensor_model_parallel_size: 2
      max_num_batched_tokens: 8192
      max_model_len: null
      max_num_seqs: 1024
      load_format: auto
      engine_kwargs: {}
      limit_images: null
      enable_chunked_prefill: true
      enable_prefix_caching: true
      disable_log_stats: true
      skip_tokenizer_init: true
      prompt_length: ${oc.select:actor_rollout_ref.rollout.prompt_length}
      response_length: ${oc.select:actor_rollout_ref.rollout.response_length}
      temperature: ${oc.select:actor_rollout_ref.rollout.temperature}

# Key to route examples to the appropriate teacher model in multi-teacher setups. Should correspond to a field in the data proto, e.g., task.
teacher_key: data_source